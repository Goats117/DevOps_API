name: Nightly Build, Scan, and Push

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'

# OIDC requires id-token: write. Declared at top level so it applies to every
# job and there is one place to audit it.
permissions:
  id-token: write
  contents: read

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Diagnostic: print the claims GitHub ACTUALLY issues for this run so
      # they can be compared against the IAM trust policy conditions.
      # Claims are not secret; the token itself is never printed.
      # Remove this step once the role assumption works.
      - name: Show actual OIDC claims
        run: |
          TOKEN=$(curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$TOKEN" | cut -d. -f2 | python3 -c "
          import sys, base64, json
          p = sys.stdin.read().strip()
          p += '=' * (-len(p) % 4)
          d = json.loads(base64.urlsafe_b64decode(p))
          print(json.dumps({k: d.get(k) for k in ('sub','aud','iss','repository','ref')}, indent=2))
          "

      # 1. Ask AWS for a temporary token using our OIDC trust
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::887664351213:role/GitHubActions-ECR-Role
          aws-region: us-east-1 # Update if you used a different region
          debug: true

      # 2. Log Docker into your secure AWS ECR vault
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 3. Build the image, naming it with your ECR URL
      - name: Build Docker Image
        run: docker build -t ${{ steps.login-ecr.outputs.registry }}/devops-api:latest .

      # 4. Scan the image (fails the build if high vulnerabilities are found)
      # Pinned to a release tag instead of @master. Bump to the latest tag
      # (or a commit SHA) when you review it.
      - name: Run Trivy Security Scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: '${{ steps.login-ecr.outputs.registry }}/devops-api:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # 5. Only if the scan passes, push the secure image to AWS
      - name: Push to Amazon ECR
        run: docker push ${{ steps.login-ecr.outputs.registry }}/devops-api:latest